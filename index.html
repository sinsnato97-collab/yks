<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="description" content="Instagram ve Pinterest fikir galerisi." />
  <title>Fikirler</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231d64d8'/%3E%3Cpath d='M19 17H46M19 17V47M19 32H41' fill='none' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css?v=55" />
  <script src="./delete_auth.js?v=48" defer></script>
  <script src="./app.js?v=55" defer></script>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="nav-title" href="./" aria-label="Fikirler ana sayfa">
        <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 44 44" fill="none"><rect x="1" y="1" width="42" height="42" rx="10" fill="currentColor"/><path d="M14 12.5h19M14 12.5v20M14 23h15" stroke="white" stroke-width="4" stroke-linecap="round"/></svg></span>
        <span class="brand-copy"><strong>fikirler<span class="brand-dot">.</span></strong></span>
      </a>
      <button id="refreshBtn" class="nav-icon" type="button" aria-label="Yenile" title="Galeriyi yenile">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Yenile</span>
      </button>
    </div>
  </header>

  <main class="page">
    <section class="intro" aria-labelledby="heroHeading">
      <div class="intro-copy">
        <span class="intro-kicker">Instagram &amp; Pinterest</span>
        <h1 id="heroHeading">Fikirler<span class="hero-period">.</span></h1>
        <p class="intro-meta" id="introMeta" aria-live="polite">Yükleniyor...</p>
      </div>
      <div class="segmented" role="tablist" aria-label="Görünüm">
        <button class="segment active" id="postsTab" type="button" role="tab" aria-selected="true" aria-controls="gallery">Gönderiler</button>
        <button class="segment" id="archiveTab" type="button" role="tab" aria-selected="false" aria-controls="gallery">Arşiv</button>
      </div>
    </section>

    <section class="controls" aria-label="Galeri filtreleri">
      <div class="category-head">
        <h2>Kategoriler</h2>
        <div class="topic-all" id="topicAll"></div>
      </div>
      <nav class="topics" id="topicBar" aria-label="Kategoriler"></nav>
    </section>

    <section class="gallery-section" aria-labelledby="sectionTitle">
      <div class="section-head">
        <h2><span id="sectionTitle">Son eklenenler</span><span class="section-count" id="headingCount"></span></h2>
        <button id="deleteAllBtn" class="text-danger" type="button" disabled><span id="deleteAllLabel">Tümünü sil</span></button>
      </div>
      <div class="grid" id="gallery" aria-live="polite"></div>
      <div class="state" id="emptyView" hidden><span class="state-symbol" aria-hidden="true">∅</span><p class="state-title" id="emptyTitle">Henüz fikir yok.</p><p class="state-text" id="emptyDescription"></p><button id="retryBtn" class="text-link" type="button">Yeniden dene</button></div>
      <div class="state" id="errorView" hidden><span class="state-symbol" aria-hidden="true">!</span><p class="state-title">Galeri yüklenemedi.</p><p class="state-text" id="errorText">Bağlantını kontrol et.</p><button class="text-link" id="errorRetry" type="button">Yeniden dene</button></div>
    </section>
  </main>

  <footer class="site-footer"><div class="footer-inner"><span class="footer-wordmark">fikirler<span>.</span></span><span>Instagram &amp; Pinterest</span></div></footer>

  <div id="lightbox" class="viewer" role="dialog" aria-modal="true" aria-label="Görsel" aria-hidden="true" hidden>
    <div class="viewer-bar">
      <button id="closeBtn" class="viewer-btn" type="button" aria-label="Kapat" title="Kapat (Esc)"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <div class="viewer-heading"><span class="viewer-title">Fikir <span id="viewerPosition">1</span></span><span class="viewer-sub" id="viewerTime"></span></div>
      <div class="viewer-actions">
        <a id="viewerOriginal" class="viewer-btn" target="_blank" rel="noopener noreferrer" aria-label="Orijinal gönderiyi aç" title="Orijinal gönderi" hidden><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M17 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a id="downloadLink" class="viewer-btn" download="fikir.jpg" aria-label="İndir" title="İndir"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v11m0 0 4.5-4.5M12 15l-4.5-4.5M5 19.5h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <button id="archiveBtn" class="viewer-btn" type="button" aria-label="Arşive taşı" title="Arşive taşı"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8h16v10.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5zM3 4.5h18V8H3zM10 12h4" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg><span class="sr" id="archiveLabel">Arşive taşı</span></button>
        <button id="deleteBtn" class="viewer-btn danger" type="button" aria-label="Sil" title="Sil (Delete)"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M10 11v5m4-5v5M7 7l.8 11.2A2 2 0 0 0 9.8 20h4.4a2 2 0 0 0 2-1.8L17 7M9.5 7V5h5v2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <button class="viewer-nav prev" id="prevBtn" type="button" aria-label="Önceki" title="Önceki (←)"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14.5 6-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <figure class="viewer-stage"><img id="viewerImage" alt="" /><figcaption class="viewer-caption" id="viewerTopic" hidden></figcaption></figure>
    <button class="viewer-nav next" id="nextBtn" type="button" aria-label="Sonraki" title="Sonraki (→)"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9.5 6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="viewer-alert" id="deleteStatus" role="alert" hidden><span id="deleteError"></span><a id="localGalleryLink" href="http://127.0.0.1:8765/" target="_blank" rel="noopener" hidden>Galeriyi bilgisayarda aç</a></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
